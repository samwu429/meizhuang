# Optional Render Blueprint. Set secrets in the Render dashboard after create.
# 可选 Render Blueprint。创建后请在 Render 控制台设置密钥。
services:
  - type: web
    name: meizhuang-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://samwu429.github.io,https://topphi.com,http://topphi.com,http://localhost:5173

  - type: web
    name: meizhuang-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
